<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js"></script>
    <title>Results summary component</title>
  </head>
  <body>
    <main>
      <div class="results">
        <div class="container">
          <h1>Your Result</h1>
          <div class="visual-result">
            <h1>76</h1>
            <p>of 100</p>
          </div>
          <div class="description">
            <h2>Great</h2>
            <p>
              You scored higher than 65% of the people who have taken these
              tests.
            </p>
          </div>
        </div>
      </div>
      <div class="summary">
        <div class="container">
          <h1>Summary</h1>
          <ul>
            <li class="reaction">
              <div class="reaction-container">
                <div class="reaction-title">
                  <p class="title">Reaction</p>
                </div>
                <p class="reaction-res"><span>80</span> / 100</p>
              </div>
            </li>
            <li class="memory">
              <div class="memory-container">
                <div class="memory-title">
                  <p class="title">Memory</p>
                </div>
                <p class="memory-res"><span>92</span> / 100</p>
              </div>
            </li>
            <li class="verbal">
              <div class="verbal-container">
                <div class="verbal-title">
                  <p class="title">Verbal</p>
                </div>
                <p class="verbal-res"><span>61</span> / 100</p>
              </div>
            </li>
            <li class="visual">
              <div class="visual-container">
                <div class="visual-title">
                  <p class="title">Visual</p>
                </div>
                <p class="visual-res"><span>72</span> / 100</p>
              </div>
            </li>
          </ul>
          <button>Continue</button>
        </div>
      </div>
    </main>
  </body>
</html>
